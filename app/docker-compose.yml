
# Morgenruf — Mac / Linux self-hosted quickstart
# Usage:
#   1. cp .env.example .env && fill in .env
#   2. docker compose up -d
#   3. Visit http://localhost:3000/dashboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: morgenruf
      POSTGRES_PASSWORD: ${DB_PASSWORD:-morgenruf}
      POSTGRES_DB: morgenruf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morgenruf"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies any pending SQL migrations, then exits. The app image
  # does not migrate on start, so without this the schema is never created.
  # Mirrors the migrate initContainer in the Helm chart.
  migrate:
    image: morgenruf/morgenruf:${MORGENRUF_VERSION:-latest}
    command: ["python", "src/migrate.py"]
    environment:
      DATABASE_URL: postgresql://morgenruf:${DB_PASSWORD:-morgenruf}@db:5432/morgenruf
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: morgenruf/morgenruf:${MORGENRUF_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://morgenruf:${DB_PASSWORD:-morgenruf}@db:5432/morgenruf
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: morgenruf/morgenruf-frontend:${MORGENRUF_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      BACKEND_URL: http://app:3000
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data:
