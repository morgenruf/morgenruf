{{/*
The frontend proxies every backend route it does not serve itself, so it is the
front door. This service keeps its original name and port and now points at the
frontend, which means an ingress, tunnel or Service reference that worked before
the frontend existed keeps working and starts serving the dashboard again.
The backend is reachable on its own name for anything that wants it directly.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "morgenruf.fullname" . }}
  labels:
    {{- include "morgenruf.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "morgenruf.name" . }}-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "morgenruf.fullname" . }}-backend
  labels:
    {{- include "morgenruf.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
  selector:
    {{- include "morgenruf.selectorLabels" . | nindent 4 }}
