{{- if .Values.httpRoute.enabled -}}
{{- $hostName := .Values.httpRoute.hostName | required ".Values.httpRoute.hostName is required." -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "morgenruf.fullname" . }}
  namespace: {{ include "morgenruf.namespace" . }}
  labels:
    {{- include "morgenruf.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
  hostnames:
    - {{ $hostName | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "morgenruf.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
