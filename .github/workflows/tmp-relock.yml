name: tmp relock
on:
  push:
    branches: [chore/deps-batch-2026-10-28]
permissions:
  contents: write
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: |
          git config user.name "Anmol Nagpal"
          git config user.email "ianmolnagpal@gmail.com"
          git commit -am "chore(deps): regenerate pnpm-lock.yaml" && git push
