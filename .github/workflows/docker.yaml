name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r app/requirements.txt ruff pytest pytest-mock
      - run: ruff check app/src/
      - run: ruff format --check app/src/
      - run: python -m pytest app/tests/ scripts/tests/ -q
      - run: ruff check scripts/dev.py scripts/tests/
      - run: ruff format --check scripts/dev.py scripts/tests/

  frontend-checks:
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: morgenruf/morgenruf
            context: ./app
            dockerfile: ./app/Dockerfile
            cache: backend
          - image: morgenruf/morgenruf-frontend
            context: .
            dockerfile: ./frontend/Dockerfile
            cache: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      # A staging tag is never used by Compose or Helm. Release tags are only
      # promoted after BOTH images and ALL checks below have completed.
      - name: Build and stage (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.image }}:build-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
          provenance: true
          sbom: true
      - name: Scan the staged digest
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.cache }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: trivy-${{ matrix.cache }}.sarif
          category: ${{ matrix.cache }}
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign the staged digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/$IMAGE@$DIGEST"
      - name: Record release manifest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG_METADATA: ${{ steps.meta.outputs.json }}
          COMPONENT: ${{ matrix.cache }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = {
              'image': os.environ['IMAGE'],
              'digest': os.environ['DIGEST'],
              'tags': json.loads(os.environ['TAG_METADATA'])['tags'],
          }
          Path(f"{os.environ['COMPONENT']}.json").write_text(json.dumps(manifest))
          PY
      - name: Upload release manifest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.cache }}
          path: ${{ matrix.cache }}.json
          retention-days: 7

  publish:
    name: Publish frontend and backend together
    if: github.event_name != 'pull_request'
    needs: [backend-checks, frontend-checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Prevent a branch publication and a tagged release from interleaving.
    concurrency:
      group: morgenruf-release-promotion
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: release-images
      - name: Promote both verified digests to their matching release tags
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          manifests = [json.loads(path.read_text()) for path in Path('release-images').glob('*.json')]
          expected = {'morgenruf/morgenruf', 'morgenruf/morgenruf-frontend'}
          if len(manifests) != 2 or {item['image'] for item in manifests} != expected:
              raise SystemExit('Both image manifests are required before publishing.')
          tag_sets = [{tag.split(':', 1)[1] for tag in item['tags']} for item in manifests]
          if tag_sets[0] != tag_sets[1]:
              raise SystemExit('Frontend and backend must publish matching release tags.')
          for item in manifests:
              if not re.fullmatch(r'sha256:[a-f0-9]{64}', item['digest']):
                  raise SystemExit('Missing or invalid build digest.')
              if not item['tags'] or any(not tag.startswith(item['image'] + ':') for tag in item['tags']):
                  raise SystemExit('Invalid release tags.')
              subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', f"{item['image']}@{item['digest']}"], check=True)
          for item in manifests:
              command = ['docker', 'buildx', 'imagetools', 'create']
              for tag in item['tags']:
                  command.extend(['--tag', tag])
              # A single multi-platform source is copied without changing its
              # digest, retaining the scanned/signed index and attestations.
              command.append(f"{item['image']}@{item['digest']}")
              subprocess.run(command, check=True)
          PY
