version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: helm
    directory: /app/helm/morgenruf
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # A Postgres major version cannot start on the previous major's data
      # directory, so helm upgrade would break every existing install. Major
      # upgrades are planned by hand with a dump and restore path.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
