version: 2
# Minor and patch bumps arrive as one PR per ecosystem a week instead of one
# per package, and packages that must move together (react and react-dom)
# land in the same PR. Majors still get their own PR.
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: helm
    directory: /app/helm/morgenruf
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A Postgres major version cannot start on the previous major's data
      # directory, so helm upgrade would break every existing install. Major
      # upgrades are planned by hand with a dump and restore path.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint refuses to load on TypeScript 7 (peer range is
      # <6.1.0), so lint fails. Remove once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
