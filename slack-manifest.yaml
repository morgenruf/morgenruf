display_information:
  name: Morgenruf
  description: "Async daily standups in Slack: private DMs, one clean channel summary, AI summaries and analytics. Hosted or self-hosted."
  background_color: "#0d1117"
  long_description: "Morgenruf runs your team's daily standups in Slack. At the time you choose, it DMs each person your standup questions, then posts one tidy summary to your channel, with an optional AI summary (OpenAI or Anthropic).\n\nKey features:\n• AI standup summaries\n• Dashboard with participation charts\n• Several standups per workspace\n• Each person's own timezone\n• Skip a day, edit your answers, mood check-in\n• Kudos with a leaderboard\n• Coffee chats, birthdays and work anniversaries\n• Jira, GitHub and Linear issue links\n• Webhooks\n• MCP server: connect Claude, Cursor or GitHub Copilot to your standup data\n• Admin roles\n• Weekly digest emails\n• Use the hosted version at morgenruf.dev, or self-host on Kubernetes, Docker Compose or AWS\n\nMIT licensed and free forever.\n\nDocs: https://docs.morgenruf.dev"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Morgenruf
    always_online: true
  slash_commands:
    - command: /morgenruf
      description: Your profile, and what Morgenruf can do
      usage_hint: "[profile | help]"
    - command: /morgenruf-standup
      description: Start your daily standup now
    - command: /morgenruf-skip
      description: Skip today's standup
    - command: /morgenruf-kudos
      description: Give a shoutout to a teammate
      usage_hint: "@teammate [message]"
      should_escape: true
    - command: /standup
      description: Start your daily standup now (alias)
    - command: /skip
      description: Skip today's standup (alias)
    - command: /kudos
      description: Give a shoutout to a teammate (alias)
      usage_hint: "@teammate [message]"
      should_escape: true

oauth_config:
  redirect_urls:
    - "https://api.morgenruf.dev/oauth/callback"
  scopes:
    bot:
      - commands
      - app_mentions:read
      - chat:write
      - channels:read
      - groups:read
      - im:write
      - im:history
      - im:read
      - mpim:write
      - mpim:history
      - users:read
      - users:read.email
      - users.profile:read
      - emoji:read
      - reactions:write
      - team:read

settings:
  event_subscriptions:
    request_url: "https://api.morgenruf.dev/slack/events"
    bot_events:
      - message.im
      - app_mention
      - app_home_opened
      - member_joined_channel
  interactivity:
    is_enabled: true
    request_url: "https://api.morgenruf.dev/slack/interactions"
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
